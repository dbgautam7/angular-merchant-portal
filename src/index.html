<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content Security Policy: see "Security" in the README. Production should send it as an HTTP
      header, which can also carry frame-ancestors and reporting; this meta tag is the fallback.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types angular angular#bundler"
    />
    <title>Merchant Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
