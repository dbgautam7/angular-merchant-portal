name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (TypeScript, templates, accessibility rules)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: End-to-end tests on the production build
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
